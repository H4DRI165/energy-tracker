name: energy_tracker
description: "Energy Tracker App."
publish_to: 'none'
version: 0.5.7+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.5.0
  firebase_analytics: ^12.4.2
  firebase_app_check: ^0.4.5+2
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  firebase_storage: ^13.4.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_riverpod: ^3.3.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.2
  intl: ^0.20.2
  package_info_plus: ^10.1.0
  shared_preferences: ^2.5.5
  shimmer: ^3.0.0

  
dev_dependencies:
  change_app_package_name: ^1.5.0
  fake_cloud_firestore: ^4.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
